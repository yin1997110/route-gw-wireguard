# /etc/wireguard/wg0.conf — LXC 201 分流网关
# Table=51820 + FwMark=0xca6c 是分流方案核心:
#   - wg-quick 把 AllowedIPs (0/1+128/1) 写入路由表 51820，不动主表默认路由
#   - FwMark 给 WG 自身流量打标记，配合策略路由防死循环
#   - PostUp/PostDown 挂载策略路由脚本
# 不写 DNS= 行: DNS 由本机 dnsmasq 负责，避免 wg-quick 覆盖 /etc/resolv.conf

# 示例值: 私钥/公钥/入口都需换成你自己的。
# 私钥生成: wg genkey | tee privatekey | wg pubkey | grep -v '^$'  (或直接 wg genkey)
# 部署时本文件权限 600，且永远不要提交到仓库。
[Interface]
PrivateKey = <wg genkey 生成，勿提交>
Address = 10.14.0.2/16
MTU = 1420
FwMark = 0xca6c
Table = 51820
PostUp = /usr/local/bin/wg-route-up.sh
PostDown = /usr/local/bin/wg-route-down.sh

[Peer]
PublicKey = <你的对端公钥>
AllowedIPs = 0.0.0.0/1, 128.0.0.0/1
Endpoint = 203.0.113.9:51820
PersistentKeepalive = 25
