# /etc/dnsmasq.conf — 同网段旁路由的分流 DNS
# 国内域名 -> 223.5.5.5/114.114.114.114 (直连)
# gfwlist 域名 -> 隧道内上游 (见 /etc/dnsmasq.d/99-gfw.conf 与 GW_GFW_DNS)
#
# 监听接口不写死在这里：由 /etc/dnsmasq.d/00-listen.conf 跟随默认路由网卡生成，
# 换 IP/换网段不用改配置；bind-dynamic 让 dnsmasq 自动跟随地址变化。
port=53
domain-needed
bogus-priv
no-resolv
server=223.5.5.5
server=114.114.114.114
conf-dir=/etc/dnsmasq.d
bind-dynamic
no-poll
cache-size=2048
