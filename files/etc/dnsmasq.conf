# /etc/dnsmasq.conf — LXC 201 分流 DNS
# 国内域名 -> 223.5.5.5/114.114.114.114 (直连)
# gfwlist 域名 -> 162.252.172.57 (经 wg0，见 /etc/dnsmasq.d/99-gfw.conf)
port=53
domain-needed
bogus-priv
no-resolv
server=223.5.5.5
server=114.114.114.114
conf-dir=/etc/dnsmasq.d
interface=lo
interface=eth0
interface=eth1
bind-interfaces
listen-address=127.0.0.1
no-poll
cache-size=2048
